<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title description">
  <title id="title">Go API Kit — Welcome</title>
  <desc id="description">Minimalist welcome screen with a Go-inspired gopher illustration, server confirmation, code example and GitHub link.</desc>
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2fbff"/><stop offset="1" stop-color="#f0f6ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1bb8d7"/><stop offset="1" stop-color="#087da9"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1c4660" flood-opacity=".09"/></filter>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#cde5e9"/></pattern>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .muted{fill:#657583}.ink{fill:#152333}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <rect x="0" y="0" width="1200" height="760" fill="url(#dots)" opacity=".32"/>
  <rect x="1" y="1" width="1198" height="758" fill="none" stroke="#ebf0f3" stroke-width="2"/>
  <g transform="translate(70 55)">
    <rect width="44" height="44" rx="14" fill="#e8f9fd"/>
    <path d="M12 21 21 13v6l-5 5 5 5v6l-9-9zM32 21l-9-8v6l5 5-5 5v6l9-9z" fill="#0b95bd"/>
    <text x="61" y="29" font-size="22" font-weight="750" letter-spacing="-.7" class="ink">go-api-kit</text>
  </g>
  <g transform="translate(973 64)">
    <circle cx="0" cy="0" r="4.5" fill="#2fbd88"/>
    <text x="14" y="5" font-size="14" font-weight="600" fill="#24785a">SERVER READY</text>
  </g>
  <line x1="68" y1="127" x2="1132" y2="127" stroke="#e8eef2"/>
  <g transform="translate(600 288)">
    <circle r="138" fill="url(#orb)"/>
    <circle r="113" fill="none" stroke="#bceef6" stroke-dasharray="3 10" stroke-width="2"/>
    <ellipse cx="0" cy="88" rx="69" ry="11" fill="#97dbe8" opacity=".23"/>
    <g transform="translate(0 -12)">
      <rect x="-64" y="-49" width="128" height="134" rx="55" fill="url(#blue)"/>
      <ellipse cx="-66" cy="-40" rx="15" ry="22" transform="rotate(-16 -66 -40)" fill="#0788af"/>
      <ellipse cx="66" cy="-40" rx="15" ry="22" transform="rotate(16 66 -40)" fill="#0788af"/>
      <ellipse cx="-66" cy="-40" rx="8" ry="13" transform="rotate(-16 -66 -40)" fill="#a6e8f2"/>
      <ellipse cx="66" cy="-40" rx="8" ry="13" transform="rotate(16 66 -40)" fill="#a6e8f2"/>
      <ellipse cx="-29" cy="-18" rx="20" ry="26" fill="#fff"/>
      <ellipse cx="29" cy="-18" rx="20" ry="26" fill="#fff"/>
      <circle cx="-25" cy="-11" r="7" fill="#203e50"/>
      <circle cx="25" cy="-11" r="7" fill="#203e50"/>
      <ellipse cx="0" cy="13" rx="18" ry="13" fill="#b1dce6"/>
      <ellipse cx="0" cy="8" rx="9" ry="6" fill="#1f536b"/>
      <path d="M-12 28q12 12 24 0" fill="none" stroke="#155575" stroke-width="3" stroke-linecap="round"/>
      <rect x="-10" y="29" width="9" height="10" rx="2" fill="white"/><rect x="1" y="29" width="9" height="10" rx="2" fill="white"/>
      <ellipse cx="-45" cy="83" rx="22" ry="9" fill="#0787ad"/>
      <ellipse cx="45" cy="83" rx="22" ry="9" fill="#0787ad"/>
    </g>
    <g transform="translate(96 82)">
      <circle r="29" fill="#fff" stroke="#d6ece8" stroke-width="2"/>
      <circle r="19" fill="#e9f9f2"/>
      <path d="m-9 0 6 6 13-14" fill="none" stroke="#1ca878" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="600" y="476" font-size="46" font-weight="780" letter-spacing="-2" text-anchor="middle" class="ink">Super! Your Go API Kit is running.</text>
  <text x="600" y="514" font-size="17" text-anchor="middle" class="muted">Your server is up and ready. Time to build something great.</text>
  <g transform="translate(278 548)" filter="url(#shadow)">
    <rect width="644" height="75" rx="15" fill="#f9fbfc" stroke="#e6edf1"/>
    <rect x="19" y="21" width="35" height="35" rx="10" fill="#eaf7fb"/>
    <text x="36.5" y="45" font-size="18" text-anchor="middle" fill="#148db2" class="mono">$</text>
    <text x="71" y="46" font-size="16" fill="#304758" class="mono">go run .</text>
    <rect x="469" y="19" width="151" height="38" rx="9" fill="#e5f8f2"/>
    <circle cx="486" cy="38" r="4.5" fill="#20b886"/>
    <text x="500" y="43" font-size="13" font-weight="650" fill="#23795c">READY TO GO</text>
  </g>
  <g transform="translate(600 676)">
    <rect x="-179" y="-23" width="358" height="48" rx="12" fill="#132633"/>
    <g transform="translate(-152 -9)" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round">
      <path d="M10 0 1 7l3 11 6-3 6 3 3-11z"/><path d="M4 17v-5q0-4 4-4h4q4 0 4 4v5"/>
    </g>
    <text x="6" y="7" text-anchor="middle" font-size="14" font-weight="630" fill="#fff">github.com/renniemaharaj/go-api-kit</text>
  </g>
  <text x="600" y="739" font-size="12" text-anchor="middle" fill="#94a3af">BUILT WITH GO  ·  POWERED BY GO API KIT</text>
  <a xlink:href="https://github.com/renniemaharaj/go-api-kit" target="_blank" aria-label="Open Go API Kit on GitHub"><rect x="421" y="653" width="358" height="48" fill="transparent"/></a>
</svg>
